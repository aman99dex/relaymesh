name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4  # also validates the wrapper jar checksum
      - run: ./gradlew :core:test :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: relaymesh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: "**/build/reports/"
